definitions:
  datasets:
    train_dataset:
      format: AIRR
      params:
        path: /central/groups/MazmanianLab/jboktor/PDMBS/pdairr/data/interim/airr/ImmuneML/data_input/participant_repertoires
        metadata_file: /central/groups/MazmanianLab/jboktor/PDMBS/pdairr/data/interim/airr/ImmuneML/metadata/metadata_pid_ppmi.csv
        is_repertoire: true
        import_productive: true
        import_with_stop_codon: false
        import_out_of_frame: false
        import_illegal_characters: false
        import_empty_nt_sequences: true
        import_empty_aa_sequences: false
        region_type: IMGT_CDR3
    test_dataset:
      format: AIRR
      params:
        path: /central/groups/MazmanianLab/jboktor/PDMBS/pdairr/data/interim/airr/ImmuneML/data_input/participant_repertoires
        metadata_file: /central/groups/MazmanianLab/jboktor/PDMBS/pdairr/data/interim/airr/ImmuneML/metadata/metadata_pid_biofind.csv
        is_repertoire: true
        import_productive: true
        import_with_stop_codon: false
        import_out_of_frame: false
        import_illegal_characters: false
        import_empty_nt_sequences: true
        import_empty_aa_sequences: false
        region_type: IMGT_CDR3

  encodings:
    compairr_1mm:
      CompAIRRSequenceAbundance:
        compairr_path: /central/groups/MazmanianLab/jboktor/software/compairr/src/compairr
        p_value_threshold: 0.001
        ignore_genes: true
        threads: 8

  ml_methods:
    log_reg_compairr:
      LogisticRegression:
        penalty: l1
        C: [0.1, 1.0]
      model_selection_cv: true
      model_selection_n_folds: 3

  reports:
    roc_summary: ROCCurveSummary

instructions:
  train_ppmi_compairr:
    type: TrainMLModel
    dataset: train_dataset
    labels:
      - case_control_other_latest:
          positive_class: Case
    settings:
      - encoding: compairr_1mm
        ml_method: log_reg_compairr
    assessment:
      split_strategy: random
      split_count: 1
      training_percentage: 0.7
    selection:
      split_strategy: k_fold
      split_count: 3
    strategy: GridSearch
    optimization_metric: balanced_accuracy
    metrics: [auc, balanced_accuracy]
    reports:
      - roc_summary
    refit_optimal_model: true
    number_of_processes: 8

  apply_ppmi_to_biofind_compairr:
    type: MLApplication
    dataset: test_dataset
    config_path: ./train_ppmi_compairr/optimal_case_control_other_latest/zip/ml_settings_case_control_other_latest.zip
    number_of_processes: 4
    metrics:
      - accuracy
      - balanced_accuracy
      - auc
      - precision
      - recall
      - f1_micro
      - confusion_matrix
